<!DOCTYPE html>
<html>
    <head>
        <body>
            <label>SEARCH</label>
            <input type="text" list="fruits"/>

            <datalist id="fruits">
                <option mango/>
                <option apple/>
                <option banana/>
                <option orange/>
                <option pineapple/>
                <option dragons/>
            </datalist><br/><br/>

            <fieldset>
                <legend basic info>
                    <label for="name">NMAE </label>
                    <input type="text " id="name" placeholder="enter your name"/>
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" placeholder="enter your email"/>
                </legend>
            </fieldset><br/>

             <fieldset>
                <legend contact info>
                    <label>NUMBER</label>
                    <input type="number " placeholder="enter your number"/>
                    <label>ADDRESS</label>
                    <input type="address"  placeholder="enter your address"/>
                </legend>
            </fieldset><br/>

            <fieldset>
                <input type="submit"/>
            </fieldset>
        </body>
    </head>
</html>
